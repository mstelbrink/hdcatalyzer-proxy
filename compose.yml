services:
  web-service:
    container_name: web-service
    build: .
    ports: 
      - "8080:8080"
    depends_on: 
      - mongodb
  mongodb:
    image: mongodb/mongodb-community-server:latest
    container_name: mongodb
    ports:
      - "27017:27017"
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama: